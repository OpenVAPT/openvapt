name: zz-release-path-test
# TEMPORARY: proves the release.yml path with the upgraded actions. Not merged.
on:
  push:
    branches: [test/release-path-upgrade, deps/actions-upgrade-safe]
  workflow_dispatch:
permissions:
  contents: read
env:
  TAG: v0.0.0-test
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        builder: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build, reproducible
        run: make release VERSION="$TAG" COMMIT="$GITHUB_SHA"
      - name: Checksums
        run: |
          set -eu
          go version > dist/release/GO_VERSION.txt
          cd dist/release
          rm -f SHA256SUMS
          sha256sum openvapt_linux_* GO_VERSION.txt > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}-${{ matrix.builder }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  compare-sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}-1
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}-2
          path: build2
      - name: Both builds must be identical (copied from release.yml)
        run: |
          set -eu
          ls -la dist/release build2
          for f in openvapt_linux_amd64 openvapt_linux_arm64 GO_VERSION.txt; do
            a=$(sha256sum "dist/release/$f" | cut -d' ' -f1)
            b=$(sha256sum "build2/$f" | cut -d' ' -f1)
            [ "$a" = "$b" ] || { echo "::error::$f differs between build 1 ($a) and build 2 ($b); not publishing"; exit 1; }
            echo "$a  $f  (both builds)"
          done
          grep -E ' openvapt_linux_' build2/SHA256SUMS | sort > "$RUNNER_TEMP/sums2"
          grep -E ' openvapt_linux_' dist/release/SHA256SUMS | sort > "$RUNNER_TEMP/sums1"
          diff "$RUNNER_TEMP/sums1" "$RUNNER_TEMP/sums2"
          (cd dist/release && sha256sum -c --strict SHA256SUMS)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign (same command line as release.yml)
        run: |
          set -eu
          cosign version
          cd dist/release
          for f in openvapt_linux_amd64 SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          head -c 400 SHA256SUMS.sigstore.json; echo
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/openvapt_linux_amd64
            dist/release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: compare-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v3-new-installer
            installer: new
            release: ""
          - name: v2.5.2-old-installer
            installer: old
            release: ""
          - name: v2.4.3
            installer: old
            release: v2.4.3
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: rel
      - if: matrix.installer == 'new'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - if: matrix.installer == 'old' && matrix.release == ''
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - if: matrix.installer == 'old' && matrix.release != ''
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: ${{ matrix.release }}
      - name: Verify (install.sh command, test-branch identity)
        run: |
          set -eu
          cosign version
          SIGNER="^https://github\.com/OpenVAPT/openvapt/\.github/workflows/zz-release-path-test\.yml@refs/heads/.*$"
          ISSUER="https://token.actions.githubusercontent.com"
          cd rel
          for f in openvapt_linux_amd64 SHA256SUMS; do
            cosign verify-blob --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
              --certificate-github-workflow-repository OpenVAPT/openvapt \
              --bundle "$f.sigstore.json" "$f"
          done

  gh-attestation:
    needs: compare-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: rel
      - name: gh attestation verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify rel/openvapt_linux_amd64 --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/zz-release-path-test.yml"
