name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (unit and lab)
        run: go test -race ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.0 -exclude=G204,G304 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Build Linux binaries
        run: make release
      - name: Installer lint (shellcheck)
        run: shellcheck -s sh scripts/install.sh
      - name: Installer end to end (verified install, tamper refusal)
        run: |
          set -eu
          rel="$RUNNER_TEMP/rel/download/v0.0.0-ci"; mkdir -p "$rel"
          cp dist/release/openvapt_linux_* dist/release/SHA256SUMS "$rel/"
          export OPENVAPT_BASE_URL="file://$RUNNER_TEMP/rel"
          sh scripts/install.sh --version v0.0.0-ci --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/openvapt" version
          printf 'x' >> "$rel/openvapt_linux_amd64"
          if sh scripts/install.sh --version v0.0.0-ci --dir "$RUNNER_TEMP/bin2"; then echo "tampered binary was installed"; exit 1; fi
          test ! -e "$RUNNER_TEMP/bin2/openvapt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Build website assets (self-hosted, install scripts disabled)
        working-directory: site
        run: npm ci --ignore-scripts && npm run build
      - name: Vendored assets are up to date
        run: git diff --exit-code -- site/icons site/static/assets
      - name: Build website
        run: go run ./cmd/sitegen -out dist/site
      - name: Website collects no data
        run: |
          ! grep -rEl "https?://(fonts\.googleapis|www\.google-analytics|googletagmanager|cdn\.|unpkg|jsdelivr)" dist/site
          ! grep -rE "document\.cookie|localStorage|sessionStorage|navigator\.sendBeacon|fetch\(" dist/site/assets
      - name: No email addresses published (project-authored files only)
        run: |
          ! git grep -IEoh "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}" -- . ':!site/static/assets/vendor' ':!site/package-lock.json' ':!.github/workflows/ci.yml' \
            | grep -v -E "noreply|@openssh\.com|@v[0-9]|@[0-9]{4}\.|@[0-9]x\." 
