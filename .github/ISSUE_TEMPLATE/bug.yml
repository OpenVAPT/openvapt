name: Bug Report
description: OpenVAPT crashed, errored or behaved unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste secrets, hostnames, IP addresses or full reports. Redact first."
  - type: input
    id: version
    attributes: {label: OpenVAPT Version, description: Output of openvapt version}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Linux Distribution and Version}
  - type: textarea
    id: what
    attributes: {label: What Happened, description: Steps to reproduce and the redacted output}
    validations: {required: true}
